<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact me</title>
    <link rel="stylesheet" href="./styles/styles.css" />
    <link rel="stylesheet" href="./styles/index.css" />
    <script src="./scripts/contact.js" defer></script>
    <script src="./scripts/nav.js" defer></script>
  </head>

  <body>
    <nav class="main-nav" aria-label="Main navigation">
      <ul class="nav-list">
        <li>
          <a href="./index.html" class="nav-link" data-page="home">Home</a>
        </li>
        <li>
          <a href="./contact.html" class="nav-link" data-page="contact"
            >Contact Us</a
          >
        </li>
        <li>
          <a href="./about.html" class="nav-link" data-page="about">About Me</a>
        </li>
      </ul>
    </nav>

    <div id="contact" class="page-container">
      <div class="contact-container">
        <h1 class="page-title">Contact Us</h1>
        <p class="page-description">
          Have a question or want to work together?
        </p>

        <div
          class="success-message"
          data-testid="test-contact-success"
          role="alert"
          aria-live="polite"
        >
          <strong>Success!</strong> Your message has been sent.
        </div>

        <form id="contactForm" novalidate>
          <div class="form-group">
            <label for="fullName" class="form-label">
              Full Name <span class="required">*</span>
            </label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              class="form-input"
              data-testid="test-contact-name"
              aria-required="true"
              aria-describedby="error-name"
            />
            <div
              id="error-fullName"
              class="error-message"
              data-testid="test-contact-error-name"
              role="alert"
            ></div>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">
              Email Address <span class="required">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              data-testid="test-contact-email"
              aria-required="true"
              aria-describedby="error-email"
            />
            <div
              id="error-email"
              class="error-message"
              data-testid="test-contact-error-email"
              role="alert"
            ></div>
          </div>

          <div class="form-group">
            <label for="subject" class="form-label">
              Subject <span class="required">*</span>
            </label>
            <input
              type="text"
              id="subject"
              name="subject"
              class="form-input"
              data-testid="test-contact-subject"
              aria-required="true"
              aria-describedby="error-subject"
            />
            <div
              id="error-subject"
              class="error-message"
              data-testid="test-contact-error-subject"
              role="alert"
            ></div>
          </div>

          <div class="form-group">
            <label for="message" class="form-label">
              Message <span class="required">*</span>
            </label>
            <textarea
              id="message"
              name="message"
              class="form-textarea"
              data-testid="test-contact-message"
              aria-required="true"
              aria-describedby="error-message"
            ></textarea>
            <div
              id="error-message"
              class="error-message"
              data-testid="test-contact-error-message"
              role="alert"
            ></div>
          </div>

          <button
            type="submit"
            class="form-submit"
            data-testid="test-contact-submit"
          >
            Send Message
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
